<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Technical Writing Notes</title>
    <meta name="description" content="Study notes for Technical Writing — unit-wise answers and quick revision.">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Top Bar -->
    <header class="topbar">
        <div class="topbar-inner">
            <span class="topbar-title">Technical Writing Notes</span>
            <button class="theme-btn" id="theme-toggle" aria-label="Toggle theme">
                <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
                <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
            </button>
        </div>
    </header>

    <!-- Unit Tabs -->
    <nav class="unit-tabs" id="unit-tabs">
        <button class="unit-tab active" data-unit="0">Unit 1</button>
        <button class="unit-tab" data-unit="1">Unit 2</button>
        <button class="unit-tab" data-unit="2">Unit 3</button>
        <button class="unit-tab" data-unit="3">Unit 4</button>
        <button class="unit-tab" data-unit="4">Unit 5</button>
        <button class="unit-tab" data-unit="raw">Raw Notes</button>
    </nav>

    <!-- Type Tabs -->
    <div class="type-tabs" id="type-tabs">
        <button class="type-tab active" data-type="full">Full Answers</button>
        <button class="type-tab" data-type="quick">Quick Revision</button>
    </div>

    <!-- Content -->
    <main class="content" id="content">
        <div class="content-inner" id="markdown-content">
            <p class="placeholder-text">Loading...</p>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/marked@9.1.6/marked.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
