<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

            </div>
            <div class="nav-links" id="nav-links"></div>

                </button>
            </div>
            <div id="markdown-content" class="markdown-body">

                    <p>Select a unit from the sidebar to start reading.</p>
